name: Publish PPA source package

on:
  workflow_dispatch:
    inputs:
      launchpad_owner:
        description: Launchpad user or team that owns the PPA.
        required: true
        default: hashb
      ppa_name:
        description: Launchpad PPA name.
        required: true
        default: qpoases
      ubuntu_series:
        description: Comma-separated Ubuntu series to publish to.
        required: true
        default: noble,jammy,focal,bionic,xenial
      version_suffix:
        description: Optional suffix after the Ubuntu version; defaults to run number and attempt.
        required: false
        default: ""

jobs:
  publish:
    name: Sign and upload source package
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    env:
      DEBFULLNAME: ${{ secrets.DEBFULLNAME }}
      DEBEMAIL: ${{ secrets.DEBEMAIL }}
      LAUNCHPAD_GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
      LAUNCHPAD_GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
      LAUNCHPAD_PPA: ${{ secrets.LAUNCHPAD_PPA }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake devscripts debhelper dpkg-dev dput gnupg

      - name: Import Launchpad signing key
        run: |
          set -euo pipefail
          if [ -z "${LAUNCHPAD_GPG_PRIVATE_KEY}" ]; then
            echo "LAUNCHPAD_GPG_PRIVATE_KEY is not set" >&2
            exit 1
          fi

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s\n' "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          {
            printf '%s\n' "allow-loopback-pinentry"
            printf '%s\n' "allow-preset-passphrase"
          } > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true

          printf '%s\n' "${LAUNCHPAD_GPG_PRIVATE_KEY}" | gpg --batch --import
          key_id="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')"
          if [ -z "${key_id}" ]; then
            echo "No secret GPG key was imported" >&2
            exit 1
          fi

          if [ -n "${LAUNCHPAD_GPG_PASSPHRASE:-}" ]; then
            keygrip="$(gpg --batch --with-keygrip --list-secret-keys "${key_id}" | awk '/Keygrip =/ { print $3; exit }')"
            if [ -n "${keygrip}" ]; then
              /usr/lib/gnupg/gpg-preset-passphrase --preset \
                --passphrase "${LAUNCHPAD_GPG_PASSPHRASE}" \
                "${keygrip}" || true
            fi
          fi

          echo "DEBSIGN_KEYID=${key_id}" >> "${GITHUB_ENV}"

      - name: Build and upload source packages
        run: |
          set -euo pipefail
          series_input="${{ inputs.ubuntu_series }}"
          series_input="${series_input// /}"
          suffix_input="${{ inputs.version_suffix }}"
          target_ppa="${LAUNCHPAD_PPA:-ppa:${{ inputs.launchpad_owner }}/${{ inputs.ppa_name }}}"
          if [ -z "${target_ppa}" ]; then
            echo "No Launchpad PPA target configured" >&2
            exit 1
          fi

          suffix="${suffix_input}"
          if [ -z "${suffix}" ]; then
            suffix="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi

          export DEBFULLNAME="${DEBFULLNAME:-qpOASES PPA Builder}"
          export DEBEMAIL="${DEBEMAIL:-qpoases-ppa@example.invalid}"

          upstream_version="$(dpkg-parsechangelog -S Version | sed -E 's/-.*$//')"
          git archive --format=tar \
            --prefix="qpoases-${upstream_version}/" \
            HEAD -- . ':(exclude)debian' \
            | gzip -n > "../qpoases_${upstream_version}.orig.tar.gz"

          cp debian/changelog /tmp/qpoases-changelog.orig
          IFS=',' read -r -a series_list <<< "${series_input}"
          for series in "${series_list[@]}"; do
            if [ -z "${series}" ]; then
              continue
            fi

            case "${series}" in
              xenial) series_version="ubuntu16.04" ;;
              bionic) series_version="ubuntu18.04" ;;
              focal) series_version="ubuntu20.04" ;;
              jammy) series_version="ubuntu22.04" ;;
              noble) series_version="ubuntu24.04" ;;
              resolute) series_version="ubuntu26.04" ;;
              *) series_version="${series}" ;;
            esac

            cp /tmp/qpoases-changelog.orig debian/changelog
            upload_version="${upstream_version}-1~${series_version}.${suffix}"
            dch --force-distribution \
              --distribution "${series}" \
              --newversion "${upload_version}" \
              "Build for ${series} PPA."

            dpkg-buildpackage -S -sa -k"${DEBSIGN_KEYID}"
            dput "${target_ppa}" "../qpoases_${upload_version}_source.changes"
          done
